[package]
name = "bondops"
version = "0.1.0"
edition = "2021"
description = "Verifiable bond servicing on Solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "bondops"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", features = ["token"] }
